name: CI/CD - Dragon Ball API (Docker + Render)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Integração Contínua (CI) - Checagem de Tipos e Build
  # ============================================================================
  ci:
    name: 1. Integração Contínua (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 3. Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: 4. Instalar Dependências do Backend
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: 5. Checagem Estática de Tipos (tsc --noEmit)
        working-directory: ./backend
        run: pnpm run type-check

      - name: 6. Compilar Projeto TypeScript (Build)
        working-directory: ./backend
        run: pnpm run build

  # ============================================================================
  # 2. Validação de Contêiner (CD) - Build da Imagem Docker
  # ============================================================================
  docker-build:
    name: 2. Validação do Build Docker (CD)
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Construir Imagem Docker de Produção
        run: docker build -t dragonball-api:ci ./backend

  # ============================================================================
  # 3. Implantação Contínua (Deploy no Render via Webhook)
  # ============================================================================
  deploy-render:
    name: 3. Deploy Contínuo no Render (Webhook)
    needs: [docker-build]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Disparar Deploy Hook no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Erro: O segredo RENDER_DEPLOY_HOOK_URL não está configurado no repositório!"
            exit 1
          fi

          echo "Disparando deploy na nuvem do Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Resposta do Render: $HTTP_BODY"
          echo "Código de Status HTTP: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Falha ao acionar o Deploy Hook no Render (Status $HTTP_STATUS)!"
            exit 1
          fi

      - name: 2. Publicar Resumo do Deploy
        run: |
          echo "### 🚀 Entrega Contínua Concluída com Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- **Projeto**: Dragon Ball API (Backend)" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente**: Produção (Render Web Service - Docker)" >> $GITHUB_STEP_SUMMARY
          echo "- **Gatilho**: Deploy Hook via GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
